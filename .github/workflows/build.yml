name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: 编译验证（不签名）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: 构建 .app
        run: make bundle

      - name: 检查产物
        run: |
          ls -la build/ClipStats.app/Contents/MacOS/
          file build/ClipStats.app/Contents/MacOS/ClipStats
          lipo -archs build/ClipStats.app/Contents/MacOS/ClipStats
