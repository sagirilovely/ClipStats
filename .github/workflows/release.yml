name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 打包并发布
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          sw_vers
          swift --version

      - name: 构建通用二进制并打包
        run: ARCH=universal ./scripts/package.sh

      - name: 列出产物
        run: ls -lh dist && cat dist/SHA256SUMS.txt || true

      - name: 创建 Release 并上传安装包
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "ClipStats ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            dist/*

      - name: 保留构建产物（可在 Actions 页面下载）
        uses: actions/upload-artifact@v4
        with:
          name: ClipStats-universal
          path: dist/*
          if-no-files-found: error
